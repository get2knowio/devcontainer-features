name: "Release Dev Container Features"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump versions for changed features
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          for feature_json in src/*/devcontainer-feature.json; do
            feature_dir=$(dirname "$feature_json")
            feature_name=$(basename "$feature_dir")

            # Check if this feature has changes since last release
            if [ -z "$LAST_TAG" ] || [ -n "$(git diff "$LAST_TAG" -- "$feature_dir")" ]; then
              current=$(jq -r .version "$feature_json")
              major=$(echo "$current" | cut -d. -f1)
              minor=$(echo "$current" | cut -d. -f2)
              patch=$(echo "$current" | cut -d. -f3)
              new="$major.$minor.$((patch + 1))"
              jq --arg v "$new" '.version = $v' "$feature_json" > tmp.json && mv tmp.json "$feature_json"
              echo "Bumped $feature_name: $current -> $new"
            else
              echo "Skipped $feature_name (no changes)"
            fi
          done

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/*/devcontainer-feature.json
          git diff --cached --quiet || git commit -m "chore: auto-bump feature versions for release"
          git push

      - name: Tag release
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Validate feature metadata before publish
        uses: devcontainers/action@v1
        with:
          validate-only: "true"

      - name: Check agentsh generated docs references
        run: |
          AGENTSH_VERSION=$(jq -r .version src/agentsh/devcontainer-feature.json)
          grep -q "ghcr.io/get2knowio/devcontainer-features/agentsh:${AGENTSH_VERSION}" src/agentsh/README.md
          grep -q "ghcr.io/get2knowio/devcontainer-features/agentsh" README.md

      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: agentsh publish summary
        run: |
          AGENTSH_VERSION=$(jq -r .version src/agentsh/devcontainer-feature.json)
          echo "Published ghcr.io/get2knowio/devcontainer-features/agentsh:${AGENTSH_VERSION}"
          echo "Published ghcr.io/get2knowio/devcontainer-features/agentsh:latest"
          echo "Verify GHCR package visibility is public after publish."
