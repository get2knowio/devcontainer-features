name: "Test Dev Container Features"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ai-clis
          - modern-cli-tools
          - node-dev-tools
          - rust-dev-tools
          - github-actions-tools
          - python-tools
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Run auto-generated tests
        run: devcontainer features test --features ${{ matrix.feature }} --base-image ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ai-clis
          - modern-cli-tools
          - node-dev-tools
          - rust-dev-tools
          - github-actions-tools
          - python-tools
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Run scenario tests
        run: devcontainer features test --features ${{ matrix.feature }} --skip-autogenerated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Run global scenario tests
        run: devcontainer features test --global-scenarios-only .
